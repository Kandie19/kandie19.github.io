name: Elevate Executive Topbar

on:
  push:
    paths:
      - '.github/workflows/elevate-topbar.yml'

permissions:
  contents: write

jobs:
  elevate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine topbar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '.top{height:60px;border:1px solid var(--l);display:grid;grid-template-columns:270px 1fr 390px;align-items:center;background:#030a11f7;position:sticky;top:6px;z-index:30;box-shadow:0 0 35px #00182788}.brand{display:flex;gap:10px;align-items:center;padding-left:7px}.mark{width:43px;height:43px;display:grid;place-items:center;color:var(--c);font-size:23px;font-weight:700;border:1px solid #208bc0;clip-path:polygon(50% 0,91% 19%,91% 81%,50% 100%,9% 81%,9% 19%);box-shadow:0 0 20px #008cff33}.brand b{font-size:15px;letter-spacing:.13em}.brand small{display:block;color:#718692;font-size:7px;letter-spacing:.16em;margin-top:3px}.nav{display:flex;justify-content:center;gap:3px;overflow:auto}.nav button{background:none;border:1px solid transparent;padding:10px 8px;font-size:8px;letter-spacing:.1em;white-space:nowrap}.nav button:hover,.nav button.active{color:var(--c);background:#061d2d;border-color:#176f9b}.status{display:flex;justify-content:flex-end;gap:6px}.statusbox{border:1px solid var(--l);padding:7px 9px;min-width:112px;font-size:8px}.statusbox small{display:block;color:#607782;font-size:6px;margin-bottom:4px}.ok{color:var(--g)}.dev{color:var(--c)}.clock span{display:block;color:#667c87;font-size:6px;margin-top:3px}'

          new = '''.top{min-height:68px;padding:8px 12px;border:1px solid #153b51;border-radius:8px;display:grid;grid-template-columns:245px minmax(0,1fr) 245px;gap:16px;align-items:center;background:linear-gradient(180deg,#07131df5,#030a11f2);position:sticky;top:8px;z-index:30;box-shadow:0 14px 40px #00131f80,inset 0 1px 0 #ffffff08}.top:after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#18caff66,transparent);pointer-events:none}.brand{display:flex;gap:11px;align-items:center;padding-left:2px;min-width:0}.mark{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:700;border:1px solid #237ea7;background:linear-gradient(145deg,#071a27,#030a10);clip-path:polygon(50% 0,91% 19%,91% 81%,50% 100%,9% 81%,9% 19%);box-shadow:0 0 20px #008cff22,inset 0 0 16px #00bfff0b}.brand b{font-size:13px;letter-spacing:.16em;white-space:nowrap}.brand small{display:block;color:#718692;font-size:6px;letter-spacing:.18em;margin-top:4px}.nav{display:flex;justify-content:center;align-items:center;gap:2px;min-width:0;overflow:visible}.nav button{background:transparent;border:1px solid transparent;border-radius:5px;padding:8px 9px;font-size:7px;letter-spacing:.11em;white-space:nowrap;color:#91a4ae;transition:.18s ease}.nav button:hover,.nav button.active{color:var(--c);background:#071d2b;border-color:#164c68;box-shadow:inset 0 0 18px #00bfff0a}.status{display:flex;justify-content:flex-end;align-items:center;gap:7px;min-width:0}.statusbox{border:0;border-left:1px solid #163b4f;padding:4px 0 4px 10px;min-width:0;font-size:7px;background:transparent}.statusbox small{display:block;color:#5e7480;font-size:5px;letter-spacing:.12em;margin-bottom:4px}.ok{color:var(--g)}.dev{color:var(--c)}.clock{font-variant-numeric:tabular-nums}.clock span{display:block;color:#667c87;font-size:5px;margin-top:3px}'''

          if old not in s:
              raise SystemExit('topbar block not found')
          s = s.replace(old, new, 1)

          s = s.replace('@media(max-width:1250px){.top{grid-template-columns:230px 1fr}.status{display:none}.layout{grid-template-columns:105px 1fr}.home{grid-template-columns:1fr}.repo-grid{grid-template-columns:repeat(3,1fr)}}', '@media(max-width:1250px){.top{grid-template-columns:210px 1fr;gap:10px}.status{display:none}.nav{justify-content:flex-end}.layout{grid-template-columns:105px 1fr}.home{grid-template-columns:1fr}.repo-grid{grid-template-columns:repeat(3,1fr)}}', 1)

          s = s.replace('@media(max-width:760px){.top{height:auto;position:relative;display:block}.nav{justify-content:flex-start;margin-top:6px}', '@media(max-width:760px){.top{height:auto;min-height:0;position:relative;display:block;padding:10px}.nav{justify-content:flex-start;margin-top:8px;overflow:auto}', 1)

          s = s.replace('<header class="top"><div class="brand"><div class="mark">K</div><div><b>KELVIN KANDIE</b><small>SYSTEMS ARCHITECT · BUILDER</small></div></div>', '<header class="top"><div class="brand"><div class="mark">K</div><div><b>KELVIN KANDIE</b><small>FOUNDER · SYSTEMS ARCHITECT</small></div></div>', 1)

          p.write_text(s)
          PY
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'V15: elevate executive command center topbar'
          git push