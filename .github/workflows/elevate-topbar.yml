name: Elevate Executive Topbar

on:
  push:
    paths:
      - '.github/workflows/elevate-topbar.yml'

permissions:
  contents: write

jobs:
  elevate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose technology CV in command center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add a visible, direct CV link to the main navigation exactly once.
          if 'href="technology-cv.html"' not in s:
              nav_link = '<a class="cvLink" href="technology-cv.html">TECH CV ↗</a>'
              if '</nav>' in s:
                  s = s.replace('</nav>', nav_link + '</nav>', 1)
              else:
                  # Fallback for the compact single-file command center.
                  marker = '<div class="status">'
                  if marker in s:
                      s = s.replace(marker, nav_link + marker, 1)

          # Ensure the CV link is visually consistent with the executive navigation.
          if '.cvLink{' not in s:
              css = '.cvLink{display:inline-block;border:1px solid #1c607d;border-radius:7px;background:#06202c;color:#bcefff;padding:8px 9px;font-size:8px;letter-spacing:.05em;text-decoration:none}.cvLink:hover{color:#fff;background:#08202d;border-color:#1c607d}'
              s = s.replace('</style>', css + '</style>', 1)

          # Add an executive CV callout to the Dossier view if the page has the view.
          if 'TECHNOLOGY EXECUTIVE CV' not in s:
              marker = '<section id="contact" class="view">'
              cv = '''<div class="panel" style="border-color:#1d6583;background:linear-gradient(135deg,#071d28,#031017);margin-top:10px"><div class="head"><div><h2>TECHNOLOGY EXECUTIVE CV</h2><small>TECHNOLOGY-ONLY PROFESSIONAL PROFILE</small></div><span class="live">● CURRENT</span></div><p class="lead">Systems architecture, AI, cybersecurity, machine learning, backend and data architecture, technology experience, education and technical certifications.</p><div class="actions"><a class="action primary" href="technology-cv.html">OPEN TECHNOLOGY CV ↗</a><a class="action" href="mailto:kandiemasasabi@gmail.com?subject=Kelvin%20Kandie%20Technology%20CV">CONTACT ↗</a></div></div>'''
              if marker in s:
                  s = s.replace(marker, cv + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: expose technology executive CV in command center'
          git push
