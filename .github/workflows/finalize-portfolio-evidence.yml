name: Finalize Portfolio Evidence Layer

on:
  push:
    paths:
      - 'portfolio-evidence.js'
      - '.github/workflows/finalize-portfolio-evidence.yml'
      - '.portfolio-evidence-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate evidence layer in index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="portfolio-evidence.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html has no closing body tag')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: activate evidence-driven portfolio layer'
          git push
