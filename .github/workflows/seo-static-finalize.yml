name: Finalize Static SEO
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static identity SEO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          block='''<link rel="canonical" href="https://kandie19.github.io/">\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n<meta name="author" content="Kelvin Kandie">\n<meta property="og:type" content="profile">\n<meta property="og:title" content="Kelvin Kandie — Systems Architect">\n<meta property="og:description" content="Executive technology portfolio, engineering intelligence and AEGIS Security Platform architecture.">\n<meta property="og:url" content="https://kandie19.github.io/">\n<meta property="og:site_name" content="Kelvin Kandie">\n<meta property="og:image" content="https://kandie19.github.io/kelvin-kandie-portrait.jpg.jpg">\n<meta property="og:image:alt" content="Kelvin Kandie — Systems Architect">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="Kelvin Kandie — Systems Architect">\n<meta name="twitter:description" content="Systems architecture, intelligent systems, security engineering and AEGIS.">\n<meta name="twitter:image" content="https://kandie19.github.io/kelvin-kandie-portrait.jpg.jpg">\n<script type="application/ld+json" id="kelvin-profile-schema">{"@context":"https://schema.org","@graph":[{"@type":"ProfilePage","@id":"https://kandie19.github.io/#profile","url":"https://kandie19.github.io/","name":"Kelvin Kandie | Executive Technology Portfolio","mainEntity":{"@id":"https://kandie19.github.io/#person"}},{"@type":"Person","@id":"https://kandie19.github.io/#person","name":"Kelvin Kandie","alternateName":["Kelvin Kieran Kandie","Kandie19"],"url":"https://kandie19.github.io/","image":"https://kandie19.github.io/kelvin-kandie-portrait.jpg.jpg","jobTitle":"Systems Architect","description":"Systems Architect, Founder and Builder focused on intelligent systems, security engineering, artificial intelligence and operational decision intelligence.","address":{"@type":"PostalAddress","addressLocality":"Nairobi","addressCountry":"KE"},"sameAs":["https://www.linkedin.com/in/kelvin-kandie/","https://github.com/Kandie19","https://www.instagram.com/kandie_masasabi/"],"knowsAbout":["Systems Architecture","Artificial Intelligence","Machine Learning","Cybersecurity","Computer Vision","Decision Intelligence","Autonomous Systems","Software Engineering"]},{"@type":"WebSite","@id":"https://kandie19.github.io/#website","url":"https://kandie19.github.io/","name":"Kelvin Kandie — Executive Technology Portfolio","publisher":{"@id":"https://kandie19.github.io/#person"}}]}</script>\n'''
          if 'id="kelvin-profile-schema"' not in s:
              s=s.replace('</head>',block+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/seo-static-finalize.yml
      - name: Commit SEO hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'final: harden static identity SEO'
          git push
