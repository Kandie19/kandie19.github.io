name: Finalize Executive Portfolio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy telemetry injection and script boundary hazard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\s+src=["\']telemetry-enhancement\.js["\']></script>', '', s)
          s=s.replace('<script src=\\"telemetry-enhancement.js\\"></script>', '')
          s=s.replace('<script src=\\\"telemetry-enhancement.js\\\"></script>', '')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Disable legacy mutating workflows
        run: |
          rm -f .github/workflows/inject-executive-telemetry.yml
          rm -f telemetry-enhancement.js telemetry.js
      - name: Commit finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'final: stabilize executive portfolio rendering'
          git push
