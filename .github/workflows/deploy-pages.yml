name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static portfolio
        run: |
          rm -rf out
          mkdir -p out
          # Preserve the complete multi-page portfolio while ensuring the
          # command-center render assets are actually included in Pages.
          cp -- *.html out/ 2>/dev/null || true
          cp -- *.css out/ 2>/dev/null || true
          cp -- *.js out/ 2>/dev/null || true
          cp robots.txt out/robots.txt
          cp sitemap.xml out/sitemap.xml
          cp site.webmanifest out/site.webmanifest
          cp seo-inject.py out/seo-inject.py
          cp -- *.png out/ 2>/dev/null || true
          cp -- *.jpg out/ 2>/dev/null || true
          if [ -d assets ]; then cp -R assets out/assets; fi

      - name: Inject production SEO metadata
        run: python out/seo-inject.py

      - name: Remove build-only files
        run: rm -f out/seo-inject.py

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
