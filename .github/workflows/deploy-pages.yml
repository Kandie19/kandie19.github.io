name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare complete static portfolio
        run: |
          rm -rf out
          mkdir -p out
          rsync -a --exclude='.git' --exclude='.github' --exclude='out' ./ out/

      - name: Inject production SEO metadata
        run: python out/seo-inject.py

      - name: Remove build-only files
        run: rm -f out/seo-inject.py

      - name: Upload complete static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
