name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static portfolio
        run: |
          rm -rf out
          mkdir -p out
          cp index.html out/index.html
          cp polish.css out/polish.css
          cp "Kelvin Kandie Favicon.png" out/
          cp "Kelvin Kandie LOGO.png" out/
          cp profile.jpg.png out/
          python - <<'PY'
          from pathlib import Path
          path = Path('out/index.html')
          html = path.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="polish.css">'
          if link not in html:
              html = html.replace('</head>', link + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
