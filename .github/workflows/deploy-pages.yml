name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static portfolio
        run: |
          rm -rf out
          mkdir -p out
          cp index.html out/index.html
          cp styles.css out/styles.css
          cp script.js out/script.js
          cp final.css out/final.css 2>/dev/null || true
          cp polish.css out/polish.css 2>/dev/null || true
          cp robots.txt out/robots.txt
          cp sitemap.xml out/sitemap.xml
          cp site.webmanifest out/site.webmanifest
          cp "Kelvin Kandie Favicon.png" out/ 2>/dev/null || true
          cp "Kelvin Kandie LOGO.png" out/ 2>/dev/null || true
          cp profile.jpg.png out/profile.jpg.png
          if [ -d assets ]; then cp -R assets out/assets; fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
