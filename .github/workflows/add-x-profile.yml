name: Add X Profile

on:
  push:
    paths:
      - '.github/workflows/add-x-profile.yml'

permissions:
  contents: write

jobs:
  add-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add X profile link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'https://x.com/kelvinkandie' not in s:
              link = '<a class="cvLink" href="https://x.com/kelvinkandie" target="_blank" rel="noopener noreferrer">X ↗</a>'
              if '</nav>' in s:
                  s = s.replace('</nav>', link + '</nav>', 1)
              marker = '<section id="contact" class="view">'
              if marker in s:
                  card = '<div class="panel" style="margin-top:10px"><div class="head"><div><h2>X / PUBLIC TECHNOLOGY JOURNAL</h2><small>BUILDING IN PUBLIC · SYSTEMS ARCHITECTURE · AEGIS</small></div><span class="live">● PUBLIC</span></div><p class="lead">Follow Kelvin Kandie on X for architecture notes, AEGIS engineering progress, AI, cybersecurity, automation and lessons from building intelligent systems.</p><div class="actions"><a class="action primary" href="https://x.com/kelvinkandie" target="_blank" rel="noopener noreferrer">FOLLOW ON X ↗</a></div></div>'
                  s = s.replace(marker, card + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: expose X profile in portfolio'
          git push
