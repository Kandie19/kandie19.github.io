<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | Kelvin Kandie</title>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, '').replace(/^\//, '');
      var aliases = {
        'home': '/',
        'index': '/',
        'about': '/about.html',
        'achievements': '/achievements.html',
        'aegis': '/aegis.html',
        'architecture': '/architecture.html',
        'certifications': '/certifications.html',
        'contact': '/contact.html',
        'dossier': '/dossier.html',
        'engineering': '/engineering.html',
        'experience': '/experience.html',
        'expertise': '/expertise.html',
        'overview': '/overview.html',
        'repositories': '/repositories.html',
        'projects': '/repositories.html',
        'tech-stack': '/tech-stack.html',
        'techstack': '/tech-stack.html'
      };
      var target = aliases[path];
      if (!target && /\.html$/i.test(path)) {
        var clean = path.replace(/\.html$/i, '');
        target = aliases[clean];
      }
      if (target) {
        window.location.replace(target + window.location.search + window.location.hash);
      }
    }());
  </script>
  <style>
    html,body{margin:0;min-height:100%;background:#02070c;color:#fff;font-family:Inter,system-ui,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:12px 18px;border-radius:4px}
    p{color:#9ba7b4}
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Page not found.</h1>
      <p>The page may have moved. Return to the portfolio command center.</p>
      <a href="/">RETURN HOME</a>
    </div>
  </main>
</body>
</html>
