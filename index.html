function renderPages(){const main=document.getElementById('main');const pages={overview:`<h1>EXECUTIVE <span>OVERVIEW</span></h1><p class="lead">I build at the intersection of systems architecture, artificial intelligence, security engineering and operational decision intelligence. The portfolio is designed as a command center because the work itself is about understanding complex systems, not simply displaying code.</p><div class="cards"><div class="card"><h3>Architecture</h3><p>Designing resilient platforms around clear boundaries, contracts, observability, governance and long-term maintainability.</p></div><div class="card"><h3>Intelligence</h3><p>Turning raw signals into context, risk, prediction and actionable decisions through AI-enabled pipelines.</p></div><div class="card"><h3>Security</h3><p>Security-by-design thinking across identity, surveillance, automation, auditability and autonomous response.</p></div></div>`,aegis:`<h1>AEGIS <span>INTELLIGENCE</span></h1><p class="lead">AEGIS Security Platform is the flagship autonomous security and intelligence system being engineered as a private technology platform. Its architecture connects perception, identity, behavioral intelligence, threat assessment, decision intelligence and response orchestration.</p><div class="cards"><div class="card"><h3>Perception Layer</h3><p>Computer vision, detection, tracking, identity signals and multi-camera context.</p></div><div class="card"><h3>Decision Intelligence</h3><p>Risk scoring, threat prediction, contextual assessment and recommended action.</p></div><div class="card"><h3>Autonomous Response</h3><p>Playbooks, orchestration, event buses, audit trails and continuous learning loops.</p></div></div><div class="cards"><div class="card"><h3>Private Technology</h3><p>AEGIS source is private. Public portfolio material intentionally exposes architecture and capabilities without disclosing protected implementation.</p></div><div class="card"><h3>Enterprise Direction</h3><p>Multi-tenant, SOC-ready, SOAR-ready and designed around governance, evidence and operational accountability.</p></div><div class="card"><h3>Build Philosophy</h3><p>Architecture first. Contracts before patches. Observability before assumptions. Automation with explicit control.</p></div></div>`,experience:`<h1>TECHNOLOGY <span>EXPERIENCE</span></h1><p class="lead">A technology-focused career view. Non-technical roles are intentionally excluded from this portfolio layer so the professional narrative stays aligned with systems engineering, software and security.</p><div class="timeline"><div class="timeline-item"><div class="meta">TECHNICAL ANALYST · NAIROBI, KENYA</div><h3>CryptoTale <span class="verified">TECH</span></h3><p class="lead">Technical analysis and technology-focused work. Public professional profile available for verification.</p><a class="btn" href="https://www.linkedin.com/in/kelvin-kandie" target="_blank">VERIFY ON LINKEDIN ↗</a></div><div class="timeline-item"><div class="meta">FOUNDER · SYSTEMS ARCHITECT · BUILDER</div><h3>AEGIS Security Platform</h3><p class="lead">Independent product engineering focused on autonomous security, AI, computer vision, intelligence fusion, decision systems and response orchestration.</p></div></div>`,engineering:`<h1>ENGINEERING <span>SYSTEM</span></h1><p class="lead">The engineering layer is intentionally broad: backend architecture, frontend systems, AI/ML, infrastructure, data, DevOps and security all converge into one systems discipline.</p><div class="cards"><div class="card"><h3>Languages</h3><p>Python · TypeScript · JavaScript · C · Shell · SQL</p></div><div class="card"><h3>Platforms</h3><p>FastAPI · React · Next.js · PostgreSQL · Redis · Kafka · Docker · Kubernetes</p></div><div class="card"><h3>Intelligence</h3><p>Computer vision · identity intelligence · behavioral analytics · threat intelligence · decision intelligence</p></div><div class="card"><h3>Architecture</h3><p>APIs · event-driven systems · multi-tenancy · RBAC · auditability · observability · service boundaries</p></div><div class="card"><h3>Operations</h3><p>CI/CD · Linux · networking · monitoring · automation · infrastructure-as-code concepts</p></div><div class="card"><h3>Security</h3><p>Secure identity · access control · incident workflows · evidence chains · governance-by-design</p></div></div>`,projects:`<h1>PROJECT <span>PORTFOLIO</span></h1><p class="lead">A selected engineering surface. Public repositories are directly inspectable; private work is represented only at the appropriate architectural level.</p><div class="cards">${repos.map(r=>`<div class="card"><h3>${r[1]} ${r[4]?'<span class="verified">PRIVATE</span>':''}</h3><p>${r[2]}</p><div>${r[3].map(x=>`<span class="pill">${x}</span>`).join('')}</div><button class="btn" onclick="repoInfo('${r[1]}','${r[2]}','${r[0]}')">OPEN PROJECT BRIEF</button></div>`).join('')}</div>`,intelligence:`<h1>THREAT <span>INTELLIGENCE</span></h1><p class="lead">This layer demonstrates the mental model behind the work: signals are correlated, context is constructed, risk is assessed, and decisions are made with evidence and governance.</p><div class="cards"><div class="card"><h3>Signal Correlation</h3><p>Bring cameras, sensors, identities, events and telemetry into a common context.</p></div><div class="card"><h3>Risk & Threat</h3><p>Use scoring and prediction to prioritize what matters instead of treating every event equally.</p></div><div class="card"><h3>Decision Layer</h3><p>Convert assessment into recommended actions, playbooks and accountable outcomes.</p></div></div>`,dossier:`<h1>EXECUTIVE <span>DOSSIER</span></h1><p class="lead">Kelvin Kandie is a systems architect and builder focused on intelligent software, security platforms and decision-oriented engineering. The portfolio deliberately presents the work as an operating system rather than a résumé.</p><div class="cards"><div class="card"><h3>Positioning</h3><p>Systems Architect · Builder · Founder · AI & Security Engineering</p></div><div class="card"><h3>Core Thesis</h3><p>Build systems that perceive, understand, decide and respond — with security and governance embedded from the beginning.</p></div><div class="card"><h3>Current Focus</h3><p>AEGIS Security Platform and the engineering foundations required for an enterprise-grade autonomous security product.</p></div></div>`,writing:`<h1>THOUGHT <span>LEADERSHIP</span></h1><p class="lead">A future-facing writing surface for architecture notes, engineering lessons, security thinking and product-building essays.</p><div class="cards"><div class="card"><h3>Architecture Notes</h3><p>How to move from patching systems to designing durable contracts and boundaries.</p><button class="btn" onclick="openModal('Architecture Notes','The writing library is being assembled. This section will become the long-form technical publication layer of the command center.')">COMING SOON</button></div><div class="card"><h3>Autonomous Security</h3><p>Exploring the shift from alerting to contextual intelligence and orchestrated response.</p><button class="btn" onclick="openModal('Autonomous Security','Long-form AEGIS research and product thinking will live here as the public body of work develops.')">COMING SOON</button></div><div class="card"><h3>Builder Journal</h3><p>Practical notes from building enterprise software from architecture through deployment.</p><button class="btn" onclick="openModal('Builder Journal','A curated engineering journal is planned for this command center.')">COMING SOON</button></div></div>`,contact:`<h1>LET'S <span>CONNECT</span></h1><p class="lead">For engineering conversations, technology partnerships, product opportunities and executive introductions, use the channels below.</p><div class="contact-grid"><div class="contact-card"><b>DIRECT EMAIL</b><a href="mailto:kandiemasasabi@gmail.com">kandiemasasabi@gmail.com</a><button class="btn" onclick="copyEmail()">COPY EMAIL</button></div><div class="contact-card"><b>LINKEDIN</b><a href="https://www.linkedin.com/in/kelvin-kandie" target="_blank">linkedin.com/in/kelvin-kandie ↗</a></div><div class="contact-card"><b>GITHUB</b><a href="https://github.com/Kandie19" target="_blank">github.com/Kandie19 ↗</a></div><div class="contact-card"><b>LOCATION</b><span>Nairobi, Kenya · East Africa</span></div></div>`};for(const [id,body] of Object.entries(pages)){const s=document.createElement('section');s.className='view';s.id='view-'+id;s.innerHTML=`<div class="viewpage">${body}</div>`;main.appendChild(s)}}
function showView(id){if(!nav.some(n=>n[0]===id))id='dashboard';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+id)?.classList.add('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));history.replaceState(null,'','#'+id);if(id==='dashboard')animateBars()}
function animateBars(){setTimeout(()=>document.querySelectorAll('.fill').forEach(x=>x.style.width=x.dataset.width+'%'),80)}

function closeModal(){document.getElementById('modal').classList.remove('open')}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeCommand()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('cmd').addEventListener('click',e=>{if(e.target.id==='cmd')closeCommand()});document.getElementById('cmdInput').addEventListener('input',e=>renderCommands(e.target.value));
function updateClock(){const d=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-KE',{timeZone:'Africa/Nairobi',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)+' EAT'}setInterval(updateClock,1000);updateClock();
